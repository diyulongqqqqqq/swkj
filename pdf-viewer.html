<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档查看器 - 重定向</title>
    <!-- 重定向到完整PDF查看器 -->
    <meta http-equiv="refresh" content="0; url=/pdf-viewer-full.html">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 2rem;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 2rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 文档查看器</h1>
        <div class="spinner"></div>
        <p>正在重定向到完整PDF查看器...</p>
        <p>如果没有自动跳转，请点击 <a href="/pdf-viewer-full.html" style="color: white; text-decoration: underline;">这里</a></p>
    </div>
    
    <script>
        // JavaScript重定向，确保即使meta refresh失败也能跳转
        window.location.href = '/pdf-viewer-full.html' + window.location.search;
    </script>
</body>
</html>
